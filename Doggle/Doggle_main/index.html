<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <title>Doggle</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: #2875ce;
      background: #f7f5ef;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --green: #527b63;
      --yellow: #d3a640;
      --gray: #87918a;
      --ink: #23332c;
      --muted: #2875ce;
      --line: #d8ded7;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 28px 16px 40px;
      background:
        radial-gradient(ellipse at 12% 0%, #e8eee4 0, transparent 34rem),
        #f7f5ef;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .app {
      width: min(100%, 520px);
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      border-radius: 15px;
      background: #e4ecdf;
      font-size: 25px;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 5vw, 26px);
      letter-spacing: -0.7px;
    }

    .subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .new-game {
      flex: 0 0 auto;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fffefa;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }

    .new-game:hover { background: #ffffff; }

    .game-info {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 20px 2px 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .game-info strong { color: var(--ink); }

    .board {
      display: grid;
      gap: 7px;
      width: min(100%, var(--board-width));
      margin: 0 auto 18px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(var(--word-length), minmax(0, 1fr));
      gap: 7px;
    }

    .tile {
      display: grid;
      aspect-ratio: 1;
      place-items: center;
      border: 2px solid #d5dcd5;
      border-radius: 8px;
      background: #fffefa;
      font-size: clamp(15px, 5vw, 25px);
      font-weight: 800;
      text-transform: uppercase;
    }

    .tile.filled { border-color: #070707; }
    .tile.correct, .key.correct { border-color: var(--green); background: var(--green); color: white; }
    .tile.present, .key.present { border-color: var(--yellow); background: var(--yellow); color: white; }
    .tile.absent, .key.absent { border-color: var(--gray); background: var(--gray); color: white; }

    .guess-form {
      display: flex;
      gap: 9px;
      margin: 0 auto 13px;
    }

    .guess-input {
      min-width: 0;
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #cbd4cb;
      border-radius: 10px;
      background: #fffefa;
      color: var(--ink);
      font-size: 16px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .guess-input:focus { outline: 3px solid #527b6333; border-color: var(--green); }

    .submit {
      padding: 0 18px;
      border: 0;
      border-radius: 10px;
      background: var(--muted);
      color: white;
      cursor: pointer;
      font-weight: 800;
    }

    .submit:hover { background: #2875ce; }
    .submit:disabled, .guess-input:disabled { cursor: not-allowed; opacity: .58; }

    .message {
      min-height: 24px;
      margin: 0 0 13px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    .message.success { color: #426c50; font-weight: 800; }
    .message.error { color: #a04c3f; }

    .keyboard {
      display: grid;
      gap: 7px;
      margin: 0 auto 22px;
    }

    .key-row {
      display: flex;
      justify-content: center;
      gap: 5px;
    }

    .key {
      min-width: 0;
      flex: 1;
      max-width: 43px;
      height: 46px;
      padding: 0 2px;
      border: 0;
      border-radius: 7px;
      background: #e2e6df;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
    }

    .key.wide { max-width: 68px; font-size: 11px; }
    .key:hover:not(:disabled) { filter: brightness(.96); }
    .key:disabled { cursor: default; }

    details {
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fffefa;
      color: var(--muted);
      font-size: 13px;
    }

    summary { color: var(--ink); cursor: pointer; font-weight: 700; }
    .breed-list { margin: 10px 0 0; line-height: 1.8; }

    @media (max-width: 380px) {
      body { padding-inline: 11px; }
      .brand { gap: 8px; }
      .brand-icon { width: 40px; height: 40px; }
      .new-game { padding: 8px; font-size: 12px; }
      .row { gap: 5px; }
      .board { gap: 5px; }
      .key-row { gap: 3px; }
      .key { height: 42px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">🐾</div>
        <div>
          <h1>Doggle</h1>
          <p class="subtitle">Try to guess the dog breed in under 6 guesses. Good Luck!</p>
        </div>
      </div>
      <button class="new-game" id="newGame" type="button">New game</button>
    </header>

    <div class="game-info">
      <span>Breed length: <strong id="lengthLabel"></strong></span>
      <span>Guess <strong id="turnLabel">1</strong> of 6</span>
    </div>

    <section class="board" id="board" aria-label="Guess board"></section>

    <form class="guess-form" id="guessForm">
      <label class="sr-only" for="guessInput">Your dog breed guess</label>
      <input class="guess-input" id="guessInput" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="TYPE A BREED" aria-describedby="message">
      <button class="submit" id="submitGuess" type="submit">Guess</button>
    </form>
    <p class="message" id="message" role="status" aria-live="polite">Guess a dog breed with the matching number of letters.</p>

    <section class="keyboard" id="keyboard" aria-label="On-screen keyboard"></section>

    <details>
      <summary>AKC Dog Breed List</summary>
      <p class="breed-list" id="breedList"></p>
    </details>
  </main>

  <style>
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
      border: 0;
    }
  </style>

  <script>
    (() => {
      const breeds = [
        "Affenpinscher", "Afghan Hound", "Airedale Terrier", "Akita", "Alaskan Malamute",
         "American Bulldog", "American English Coonhound", "American Eskimo Dog", "American Foxhound", "American Hairless Terrier", "American Leopard Hound", "American Staffordshire Terrier",
          "American Water Spaniel", "Anatolian Shepherd Dog", "Appenzeller Sennenhund", "Australian Cattle Dog", "Australian Kelpie", "Australian Shepherd", "Australian Stumpy Tail Cattle Dog",  "Australian Terrier", "Azawakh",
          "Barbado da Terceira", "Barbet", "Basenji", "Basset Fauve de Bretagne", "Basset Hound", "Bavarian Mountain Scent Hound", "Beagle", "Bearded Collie", "Beauceron", "Bedlington Terrier",
          "Belgian Laekenois", "Belgian Malinois", "Belgian Sheepdog", "Belgian Tervuren", "Bergamasco Sheepdog", "Berger Picard", "Bernese Mountain Dog",
          "Bichon Frise", "Biewer Terrier", "Black and Tan Coonhound", "Black Russian Terrier", "Bloodhound", "Blue Picardy Spaniel", "Bluetick Coonhound", "Boerboel",
          "Bohemian Shepherd", "Bolognese", "Border Collie", "Border Terrier", "Borzoi", "Boston Terrier", "Bouvier des Ardennes", "Bouvier des Flandres", "Boxer",
          "Boykin Spaniel", "Bracco Italiano", "Braque du Bourbonnais", "Braque Francais Pyrenean", "Braque Saint-Germain", "Brazilian Terrier", "Briard", "Brittany", "Broholmer", "Brussels Griffon", "Bull Terrier", 
          "Bulldog", "Bullmastiff", "Cairn Terrier", "Calupoh",
          "Canaan Dog", "Canadian Eskimo Dog", "Cane Corso", "Cardigan Welsh Corgi", "Carolina Dog", "Catahoula Leopard Dog", "Caucasian Shepherd Dog", "Cavalier King Charles Spaniel", "Central Asian Shepherd Dog", "Cesky Terrier", "Chesapeake Bay Retriever",
          "Chihuahua", "Chinese Crested", "Chinese Shar-Pei", "Chinook", "Chow Chow", "Cirneco dell'Etna", "Clumber Spaniel",
          "Cocker Spaniel", "Collie", "Coton de Tulear", "Croatian Sheepdog", "Curly-Coated Retriever", "Czechoslovakian Vlciak",
          "Dachshund", "Dalmatian", "Dandie Dinmont Terrier", "Danish-Swedish Farmdog", "Deutscher Wachtelhund", "Doberman Pinscher", "Dogo Argentino",
          "Dogue de Bordeaux", "Drentsche Patrijshond", "Drever", "Dutch Shepherd", "English Cocker Spaniel",
          "English Foxhound", "English Setter", "English Springer Spaniel", "English Toy Spaniel",
          "Entlebucher Mountain Dog", "Eurasier", "Field Spaniel", "Finnish Lapphund", 
          "Finnish Spitz", "Flat-Coated Retriever", "French Bulldog", "French Spaniel", "German Longhaired Pointer", "German Pinscher", "German Shepherd Dog",
          "German Shorthaired Pointer", "German Spitz", "German Wirehaired Pointer", "Giant Schnauzer", "Glen of Imaal Terrier",
          "Golden Retriever", "Gordon Setter", "Grand Basset Griffon Vendeen", "Great Dane",
          "Great Pyrenees", "Greater Swiss Mountain Dog", "Greyhound", "Hamiltonstovare", "Hanoverian Scenthound", "Harrier", "Havanese", "Hokkaido", "Hovawart","Ibizan Hound", "Icelandic Sheepdog", "Irish Red and White Setter", "Irish Setter", "Irish Wolfhound",
          "Irish Setter", "Irish Terrier", "Irish Water Spaniel", "Irish Wolfhound", "Italian Greyhound",
          "Jagdterrier", "Japanese Akitainu", "Japanese Chin", "Japanese Spitz", "Japanese Terrier", "Kai Ken", "Karelian Bear Dog", "Keeshond", "Kerry Blue Terrier",
          "Kishu Ken", "Komondor", "Korean Jindo Dog", "Kromfohrlander", "Kuvasz", "Labrador Retriever", "Lagotto Romagnolo", "Lakeland Terrier", "Lancashire Heeler",
          "Lapponian Herder", "Large Munsterlander", "Leonberger", "Lhasa Apso", "Lowchen", "Lucas Terrier", "Maltese", "Manchester Terrier", "Mastiff",
          "Miniature American Shepherd","Miniature Bull Terrier", "Miniature Pinscher", "Miniature Schnauzer", "Miniature Cur", "Mudi", "Neapolitan Mastiff",
          "Nederlandse Kooikerhondje", "Nenets Laika", "Newfoundland", "Norfolk Terrier", "Norrbottenspets", "Norwegian Buhund", "Norwegian Elkhound", "Norwegian Lundehund",
          "Norwich Terrier", "Nova Scotia Duck Tolling Retriever", "Old Danish Pointer","Old English Sheepdog", "Otterhound",
          "Papillon", "Parson Russell Terrier", "Pekingese", "Pembroke Welsh Corgi", "Peruvian Inca Orchid", "Petit Basset Griffon Vendeen", "Pharaoh Hound",
          "Plott Hound", "Pointer", "Polish Lowland Sheepdog", "Pomeranian", "Pont-Audemer Spaniel", "Poodle", "Porcelaine", "Portugese Podengo", "Poruguese Podengo Pequeno", "Portuguese Pointer", "Portuguese Sheepdog", "Portuguese Water Dog", "Presa Canario", "Pudelpointer", "Pug", "Puli", "Pumi",
          "Pyrenean Mastiff", "Pyrenean Shepherd", "Rafeiro do Alentejo", "Rat Terrier", "Redbone Coonhound", "Rhodesian Ridgeback", "Romanian Carpathian Shepherd", "Romanian Mioritic Shepherd Dog", "Rottweiler",
          "Russell Terrier", "Russian Toy", "Russian Tsvetnaya Bolonka", "Saarloos Wolfhound", "Saint Bernard", "Saluki", "Samoyed", "Schipperke", "Scottish Deerhound", "Scottish Terrier",
          "Sealyham Terrier", "Segugio Italiano", "Shetland Sheepdog", "Shiba Inu", "Shih Tzu", "Shikoku Ken", "Siberian Husky",
          "Silken Windhound", "Silky Terrier", "Skye Terrier", "Sloughi", "Slovakian Wirehaired Pointer", "Slovensky Cuvac", "Slovensky Kopov", "Small Munsterlander", "Smooth Fox Terrier", "Soft Coated Wheaten Terrier",
          "Spanish Mastiff", "Spanish Water Dog", "Spinone Italiano", "Stabyhoun", "Staffordshire Bull Terrier", "Standard Schnauzer", "Sussex Spaniel", "Swedish Vallhund", "Taiwan Dog", "Teddy Roosevelt Terrier", "Thai Bangkaew", "Thai Ridgeback", "Tibetan Mastiff", "Tibetan Spaniel",
          "Tibetan Terrier", "Tornjak", "Tosa", "Toy Fox Terrier", "Transylvanian Hound", "Treeing Tennessee Brindle", "Treeing Walker Coonhound", "Vizsla", "Volpino Italiano", "Weimaraner", "Welsh Springer Spaniel", "Welsh Terrier", "West Highland White Terrier",
          "Wetterhoun", "Whippet", "Wire Fox Terrier", "Wirehaired Pointing Griffon", "Wirehaired Vizsla", "Working Kelpie", "Xoloitzcuintli", "Yakutian Laika", "Yorkshire Terrier",
          ""
      ];
      const rows = 6;
      const keyboardRows = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];
      const board = document.querySelector("#board");
      const input = document.querySelector("#guessInput");
      const form = document.querySelector("#guessForm");
      const message = document.querySelector("#message");
      const keyboard = document.querySelector("#keyboard");
      const keyStates = new Map();
      let answer;
      let target;
      let guesses;
      let finished;

      function startGame() {
        answer = breeds[Math.floor(Math.random() * breeds.length)];
        target = normalize(answer);
        guesses = [];
        finished = false;
        keyStates.clear();
        document.querySelector("#lengthLabel").textContent = target.length;
        document.querySelector("#turnLabel").textContent = "1";
        input.value = "";
        input.maxLength = target.length;
        input.disabled = false;
        document.querySelector("#submitGuess").disabled = false;
        message.textContent = "Guess a dog breed with the matching number of letters.";
        message.className = "message";
        drawBoard();
        drawKeyboard();
        input.focus();
      }

      function drawBoard() {
        board.replaceChildren();
        board.style.setProperty("--word-length", target.length);
        board.style.setProperty("--board-width", `${target.length * 52 + (target.length - 1) * 7}px`);
        for (let rowIndex = 0; rowIndex < rows; rowIndex += 1) {
          const row = document.createElement("div");
          row.className = "row";
          row.setAttribute("aria-label", `Guess ${rowIndex + 1}`);
          const guess = guesses[rowIndex];
          for (let column = 0; column < target.length; column += 1) {
            const tile = document.createElement("div");
            tile.className = "tile";
            if (guess) {
              tile.textContent = guess.word[column];
              tile.classList.add(guess.result[column]);
            } else if (rowIndex === guesses.length) {
              const letter = input.value.toUpperCase()[column] || "";
              tile.textContent = letter;
              if (letter) tile.classList.add("filled");
            }
            row.append(tile);
          }
          board.append(row);
        }
      }

      function drawKeyboard() {
        keyboard.replaceChildren();
        keyboardRows.forEach((letters, rowIndex) => {
          const row = document.createElement("div");
          row.className = "key-row";
          if (rowIndex === 2) {
            const enter = createKey("ENTER", "wide", submitGuess);
            row.append(enter);
          }
          for (const letter of letters) {
            const key = createKey(letter, "letter-key", () => addLetter(letter));
            const state = keyStates.get(letter);
            if (state) key.classList.add(state);
            row.append(key);
          }
          if (rowIndex === 2) row.append(createKey("⌫", "wide", removeLetter));
          keyboard.append(row);
        });
      }

      function createKey(label, extraClass, action) {
        const key = document.createElement("button");
        key.type = "button";
        key.className = `key ${extraClass}`;
        key.textContent = label;
        key.disabled = finished;
        key.setAttribute("aria-label", label === "⌫" ? "Delete last letter" : label);
        key.addEventListener("click", action);
        return key;
      }

      function addLetter(letter) {
        if (finished || input.value.length >= target.length) return;
        input.value += letter;
        drawBoard();
        input.focus();
      }

      function removeLetter() {
        if (finished) return;
        input.value = input.value.slice(0, -1);
        drawBoard();
        input.focus();
      }

      // Remove spaces and punctuation so breed names match letter-only guesses.
      function normalize(str) {
        return str.replace(/[^A-Z]/gi, "").toUpperCase();
      }

      function submitGuess(event) {
        if (event) event.preventDefault();
        if (finished) return;
        const word = input.value.trim().toUpperCase();
        if (word.length !== target.length) {
          showMessage(`This guess needs ${target.length} letters.`, "error");
          return;
        }

        const result = scoreGuess(word, target);
        guesses.push({ word, result });
        updateKeyStates(word, result);
        input.value = "";
        document.querySelector("#turnLabel").textContent = Math.min(guesses.length + 1, rows);
        drawBoard();
        drawKeyboard();

        if (word === target) {
          finish(`Good job! You found ${answer} in ${guesses.length} ${guesses.length === 1 ? "guess" : "guesses"}.`, "success");
        } else if (guesses.length === rows) {
          finish(`The breed was ${answer}. Give it another go!`, "error");
        } else {
          showMessage("Keep going! Green is the right spot; gold is in the breed.", "");
          input.focus();
        }
      }

      function scoreGuess(guess, target) {
        const result = Array(guess.length).fill("absent");
        const remaining = target.split("");
        for (let i = 0; i < guess.length; i += 1) {
          if (guess[i] === target[i]) {
            result[i] = "correct";
            remaining[i] = null;
          }
        }
        for (let i = 0; i < guess.length; i += 1) {
          if (result[i] === "correct") continue;
          const match = remaining.indexOf(guess[i]);
          if (match !== -1) {
            result[i] = "present";
            remaining[match] = null;
          }
        }
        return result;
      }

      function updateKeyStates(word, result) {
        const priority = { absent: 0, present: 1, correct: 2 };
        for (let i = 0; i < word.length; i += 1) {
          const previous = keyStates.get(word[i]);
          if (!previous || priority[result[i]] > priority[previous]) {
            keyStates.set(word[i], result[i]);
          }
        }
      }

      function showMessage(text, type) {
        message.textContent = text;
        message.className = `message${type ? ` ${type}` : ""}`;
      }

      function finish(text, type) {
        finished = true;
        input.disabled = true;
        document.querySelector("#submitGuess").disabled = true;
        drawKeyboard();
        showMessage(text, type);
      }

      form.addEventListener("submit", submitGuess);
      input.addEventListener("input", () => {
        input.value = input.value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, target.length);
        drawBoard();
      });
      document.querySelector("#newGame").addEventListener("click", startGame);
      document.querySelector("#breedList").textContent = breeds.slice().sort().join(" · ");
      startGame();
    })();
  </script>
</body>
</html>
